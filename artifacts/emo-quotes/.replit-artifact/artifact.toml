kind = "web"
previewPath = "/"
title = "Emo Quote Generator"
version = "1.0.0"
id = "artifacts/emo-quotes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26225

[services.development]
run = "pnpm --filter @workspace/emo-quotes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/emo-quotes", "run", "build" ]
publicDir = "artifacts/emo-quotes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26225"
BASE_PATH = "/"
